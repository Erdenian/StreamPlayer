[versions]

plugins_android = "9.4.1"
plugins_kotlin = "2.4.20"
plugins_detekt = "2.0.0-alpha.6"

kotlinx_coroutines = "1.11.0"

androidx_lifecycle = "2.11.0"

media3 = "1.11.1"

[plugins]

android_application = { id = "com.android.application", version.ref = "plugins_android" }
android_library = { id = "com.android.library", version.ref = "plugins_android" }
android_lint = { id = "com.android.lint", version.ref = "plugins_android" }

kotlin_compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "plugins_kotlin" }

detekt = { id = "dev.detekt", version.ref = "plugins_detekt" }

[libraries]

# region KotlinX
kotlinx_coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx_coroutines" }
# endregion

# region Compose
androidx_compose_bom = { group = "androidx.compose", name = "compose-bom", version = "2026.09.00" }
androidx_compose_ui = { group = "androidx.compose.ui", name = "ui" }
androidx_compose_ui_tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx_compose_ui_toolingPreview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx_compose_material = { group = "androidx.compose.material3", name = "material3" }
# endregion

# region AndroidX
androidx_core = { group = "androidx.core", name = "core-ktx", version = "1.19.1" }
androidx_activity = { group = "androidx.activity", name = "activity-compose", version = "1.13.0" }
androidx_lifecycle_viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx_lifecycle" }
androidx_lifecycle_runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx_lifecycle" }
# endregion

# region Media3
media3_ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3_exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3_exoplayerHls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
# endregion
